# Builds standalone programs for every platform and publishes a GitHub Release
# whenever a version tag is pushed, e.g.:  git tag v1.0.0 && git push --tags
# (or create the release/tag on github.com — this runs either way).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# Actions are pinned to exact commits (1.8.1). After the build, the maintainer signs SHA256SUMS.txt on their
# Mac (_build/sk-sign-release.sh) and uploads SHA256SUMS.txt.sig; Sensor Keeper won't self-update without it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - name: Check syntax
        run: node --check keeper.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile standalone programs
        run: |
          mkdir -p dist
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun build keeper.js --compile --minify --target=bun-$t --outfile dist/sensor-keeper-$t$ext
          done
          # keeper.js for Node installs (Raspberry Pi etc.): one bundled file with its libraries inside
          npx esbuild keeper.js --bundle --platform=node --target=node18 --outfile=dist/keeper.js --legal-comments=none
          cp install.sh install.ps1 dist/
          chmod +x "click-installers/Install Sensor Keeper (Mac).command" install.sh
          (cd click-installers && zip -q "../dist/Sensor-Keeper-Mac-installer.zip" "Install Sensor Keeper (Mac).command" \
             && zip -q "../dist/Sensor-Keeper-Windows-installer.zip" "Install Sensor Keeper (Windows).bat")
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
